name: Hy-Nomas validation

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install 'pytest>=8,<10' 'requests>=2.32,<3' 'Pillow>=11,<13'
      - name: Parse all Python source
        run: python -m compileall -q apps hymm captioning_harness scripts reactor tests
      - name: Verify English-only tracked text
        run: python scripts/audit/english_check.py
      - name: Validate providers, preflight and caption schemas
        run: python -m pytest -q tests/inference/test_pe_providers.py tests/inference/test_local_doctor.py tests/inference/test_caption_english.py tests/inference/test_caption_provider.py
      - name: Shell syntax checks
        run: bash -n scripts/local/run.sh scripts/inference/start_seg_ar_demo.sh scripts/inference/run_seg_ar_gateway.sh
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm --prefix apps/frontend ci --include=dev
      - run: npm --prefix apps/frontend run build
      - run: npm --prefix apps/frontend run lint
      - run: npm --prefix apps/frontend run test
      - name: Production dependency advisory scan
        continue-on-error: true
        run: npm --prefix apps/frontend audit --omit=dev --audit-level=high
